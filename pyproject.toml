[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loss-topology-lab"
version = "0.1.0"
description = "Strict CPU-only auditing for synthetic SFT label topologies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
authors = [{ name = "Omar Ibrahim" }]

[project.optional-dependencies]
tokenizer-lab = ["tokenizers==0.21.4"]

[project.scripts]
loss-topology-audit = "loss_topology.cli:main"
token-boundary-audit = "token_boundary.cli:main"

[tool.setuptools.packages.find]
include = ["loss_topology*", "token_boundary*"]

[tool.setuptools.package-data]
token_boundary = ["artifacts/*.json"]
