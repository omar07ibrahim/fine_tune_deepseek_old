<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1450" viewBox="0 0 1000 1450" role="img" aria-labelledby="architecture-title architecture-description">
  <title id="architecture-title">Executable token-boundary audit architecture</title>
  <desc id="architecture-description">A vertical source-derived workflow from bounded stdin through artifact verification, three tokenizer encodings, provenance replay, ownership analysis, and canonical output. The inherited trainer is shown separately as attestation-only and quarantined.</desc>
  <rect width="1000" height="1450" fill="#07111f"/>
  <style>
    .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .title { fill: #f8fafc; font-size: 32px; font-weight: 760; }
    .subtitle { fill: #d7e1ee; font-size: 18px; }
    .heading { fill: #f8fafc; font-size: 22px; font-weight: 720; }
    .label { fill: #eef4fb; font-size: 17px; font-weight: 650; }
    .body { fill: #d7e1ee; font-size: 16px; }
    .small { fill: #d7e1ee; font-size: 14px; }
    .tiny { fill: #d7e1ee; font-size: 12px; }
    .scope { fill: #dbeafe; font-size: 14px; font-weight: 680; letter-spacing: .25px; }
  </style>
  <text x="50" y="64" class="sans title">Executable token-boundary audit architecture</text>
  <text x="50" y="98" class="sans subtitle">One bounded stdin document → one canonical report; all labels below are executable boundaries</text>
  <rect x="50" y="122" width="900" height="50" rx="10" fill="#102744" stroke="#60a5fa"/>
  <text x="72" y="153" class="sans scope">NO PATH / URL / ENV-SELECTED INPUT · NO NETWORK · NO MODEL / DATASET / GPU</text>
  <rect x="130" y="210" width="740" height="116" rx="16" fill="#101f33" stroke="#2563eb" stroke-width="2"/>
  <circle cx="178" cy="268" r="26" fill="#2563eb"/>
  <text x="178" y="276" class="sans label" text-anchor="middle">1</text>
  <text x="222" y="254" class="sans heading">stdin process boundary</text>
  <text x="222" y="287" class="sans small">No arguments · regular file/FIFO · 32 KiB + sentinel · 5 s pipe deadline</text>
  <path d="M500 326 V360" stroke="#64748b" stroke-width="3"/>
  <path d="M491 351 L500 361 L509 351" fill="none" stroke="#64748b" stroke-width="3"/>
  <rect x="130" y="368" width="740" height="116" rx="16" fill="#101f33" stroke="#2563eb" stroke-width="2"/>
  <circle cx="178" cy="426" r="26" fill="#2563eb"/>
  <text x="178" y="434" class="sans label" text-anchor="middle">2</text>
  <text x="222" y="412" class="sans heading">closed synthetic case parser</text>
  <text x="222" y="445" class="sans small">Exact v1 fields · duplicate/float/invalid UTF-8 rejection · canonical input SHA-256</text>
  <path d="M500 484 V518" stroke="#64748b" stroke-width="3"/>
  <path d="M491 509 L500 519 L509 509" fill="none" stroke="#64748b" stroke-width="3"/>
  <rect x="130" y="526" width="740" height="116" rx="16" fill="#101f33" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="178" cy="584" r="26" fill="#7c3aed"/>
  <text x="178" y="592" class="sans label" text-anchor="middle">3</text>
  <text x="222" y="570" class="sans heading">fixed local tokenizer artifact</text>
  <text x="222" y="603" class="sans small">tokenizers==0.21.4 · 1,533 bytes · SHA-256 29508edbb44ce9cb…</text>
  <path d="M500 642 V676" stroke="#64748b" stroke-width="3"/>
  <path d="M491 667 L500 677 L509 667" fill="none" stroke="#64748b" stroke-width="3"/>
  <rect x="130" y="684" width="740" height="116" rx="16" fill="#101f33" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="178" cy="742" r="26" fill="#7c3aed"/>
  <text x="178" y="750" class="sans label" text-anchor="middle">4</text>
  <text x="222" y="728" class="sans heading">three fresh tokenizer instances</text>
  <text x="222" y="761" class="sans small">source truncated · source+target full · source+target right-truncated</text>
  <path d="M500 800 V834" stroke="#64748b" stroke-width="3"/>
  <path d="M491 825 L500 835 L509 825" fill="none" stroke="#64748b" stroke-width="3"/>
  <rect x="130" y="842" width="740" height="116" rx="16" fill="#101f33" stroke="#0f766e" stroke-width="2"/>
  <circle cx="178" cy="900" r="26" fill="#0f766e"/>
  <text x="178" y="908" class="sans label" text-anchor="middle">5</text>
  <text x="222" y="886" class="sans heading">independent provenance replay</text>
  <text x="222" y="919" class="sans small">NFC clusters + right-only strip · exact raw origins · fail closed on ambiguity</text>
  <path d="M500 958 V992" stroke="#64748b" stroke-width="3"/>
  <path d="M491 983 L500 993 L509 983" fill="none" stroke="#64748b" stroke-width="3"/>
  <rect x="130" y="1000" width="740" height="116" rx="16" fill="#101f33" stroke="#0f766e" stroke-width="2"/>
  <circle cx="178" cy="1058" r="26" fill="#0f766e"/>
  <text x="178" y="1066" class="sans label" text-anchor="middle">6</text>
  <text x="222" y="1044" class="sans heading">ownership oracle + inherited cutoff</text>
  <text x="222" y="1077" class="sans small">source / target / cross / injected ownership compared with len(T(source)) mask</text>
  <path d="M500 1116 V1150" stroke="#64748b" stroke-width="3"/>
  <path d="M491 1141 L500 1151 L509 1141" fill="none" stroke="#64748b" stroke-width="3"/>
  <rect x="130" y="1158" width="740" height="116" rx="16" fill="#101f33" stroke="#b45309" stroke-width="2"/>
  <circle cx="178" cy="1216" r="26" fill="#b45309"/>
  <text x="178" y="1224" class="sans label" text-anchor="middle">7</text>
  <text x="222" y="1202" class="sans heading">classification and canonical process output</text>
  <text x="222" y="1235" class="sans small">aligned / drift / cross / partial / eliminated / indeterminate · exits 0 / 1 / 2</text>
  <rect x="50" y="1328" width="900" height="70" rx="13" fill="#2b1720" stroke="#f472b6" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="72" y="1356" class="sans label">QUARANTINED SOURCE BINDING — never imported or executed</text>
  <text x="72" y="1382" class="mono small">finetune.py SHA-256 5de3316c8cf37ede… · snapshot 6912653d881b… · algorithm id only</text>
  <text x="50" y="1420" class="sans tiny">Source-bound diagram generated from CLI/contract/engine/provenance/report bytes and the legacy attestation.</text>
</svg>
