<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1210" viewBox="0 0 1000 1210" role="img" aria-labelledby="cli-title cli-description">
  <title id="cli-title">Token-boundary real stdin subprocess capture</title>
  <desc id="cli-description">A terminal-style source-generated index of all seven actual stdin CLI runs, including command, exit status, report status, primary classification, output bytes, hash prefix, and empty stderr state.</desc>
  <rect width="1000" height="1210" fill="#07111f"/>
  <style>
    .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .title { fill: #f8fafc; font-size: 32px; font-weight: 760; }
    .subtitle { fill: #d7e1ee; font-size: 18px; }
    .heading { fill: #f8fafc; font-size: 22px; font-weight: 720; }
    .label { fill: #eef4fb; font-size: 17px; font-weight: 650; }
    .body { fill: #d7e1ee; font-size: 16px; }
    .small { fill: #d7e1ee; font-size: 14px; }
    .tiny { fill: #d7e1ee; font-size: 12px; }
    .scope { fill: #dbeafe; font-size: 14px; font-weight: 680; letter-spacing: .25px; }
  </style>
  <rect x="38" y="34" width="924" height="1112" rx="18" fill="#030812" stroke="#475569" stroke-width="2"/>
  <circle cx="72" cy="68" r="7" fill="#e87979"/>
  <circle cx="98" cy="68" r="7" fill="#eab85d"/>
  <circle cx="124" cy="68" r="7" fill="#66c2a5"/>
  <text x="500" y="74" class="mono small" text-anchor="middle">real stdin subprocess capture</text>
  <line x1="38" y1="94" x2="962" y2="94" stroke="#334155"/>
  <text x="66" y="128" class="mono label">TOKEN BOUNDARY LAB / EXECUTED FIXTURE INDEX</text>
  <text x="66" y="157" class="sans small">Full canonical stdout is preserved in cli-session.txt and seven report files.</text>
  <rect x="62" y="194" width="876" height="116" rx="12" fill="#0d1b2e" stroke="#334155"/>
  <text x="82" y="224" class="mono small" fill="#93c5fd">$ python3 -m token_boundary.cli &lt; input/aligned.v1.json</text>
  <text x="82" y="255" class="sans label">exit 0 · pass · aligned</text>
  <text x="82" y="283" class="mono tiny">stdout 3127 bytes · sha256 49f851a6d89d25d5… · stderr empty</text>
  <rect x="62" y="324" width="876" height="116" rx="12" fill="#0d1b2e" stroke="#334155"/>
  <text x="82" y="354" class="mono small" fill="#93c5fd">$ python3 -m token_boundary.cli &lt; input/merge-cross-boundary.v1.json</text>
  <text x="82" y="385" class="sans label">exit 1 · fail · cross_boundary_token</text>
  <text x="82" y="413" class="mono tiny">stdout 2903 bytes · sha256 b4c7364274c4c0f4… · stderr empty</text>
  <rect x="62" y="454" width="876" height="116" rx="12" fill="#0d1b2e" stroke="#334155"/>
  <text x="82" y="484" class="mono small" fill="#93c5fd">$ python3 -m token_boundary.cli &lt; input/nfc-cross-boundary.v1.json</text>
  <text x="82" y="515" class="sans label">exit 1 · fail · cross_boundary_token</text>
  <text x="82" y="543" class="mono tiny">stdout 3054 bytes · sha256 1aeec08efe815ca1… · stderr empty</text>
  <rect x="62" y="584" width="876" height="116" rx="12" fill="#0d1b2e" stroke="#334155"/>
  <text x="82" y="614" class="mono small" fill="#93c5fd">$ python3 -m token_boundary.cli &lt; input/normalized-away.v1.json</text>
  <text x="82" y="645" class="sans label">exit 1 · indeterminate · indeterminate</text>
  <text x="82" y="673" class="mono tiny">stdout 2898 bytes · sha256 ef5b1e1ced0609f0… · stderr empty</text>
  <rect x="62" y="714" width="876" height="116" rx="12" fill="#0d1b2e" stroke="#334155"/>
  <text x="82" y="744" class="mono small" fill="#93c5fd">$ python3 -m token_boundary.cli &lt; input/partial-truncation.v1.json</text>
  <text x="82" y="775" class="sans label">exit 1 · fail · partial_target_truncation</text>
  <text x="82" y="803" class="mono tiny">stdout 3648 bytes · sha256 35186327542ccaeb… · stderr empty</text>
  <rect x="62" y="844" width="876" height="116" rx="12" fill="#0d1b2e" stroke="#334155"/>
  <text x="82" y="874" class="mono small" fill="#93c5fd">$ python3 -m token_boundary.cli &lt; input/right-strip-drift.v1.json</text>
  <text x="82" y="905" class="sans label">exit 1 · fail · boundary_drift</text>
  <text x="82" y="933" class="mono tiny">stdout 3152 bytes · sha256 ffe7b5194512f64c… · stderr empty</text>
  <rect x="62" y="974" width="876" height="116" rx="12" fill="#0d1b2e" stroke="#334155"/>
  <text x="82" y="1004" class="mono small" fill="#93c5fd">$ python3 -m token_boundary.cli &lt; input/target-eliminated.v1.json</text>
  <text x="82" y="1035" class="sans label">exit 1 · fail · target_eliminated</text>
  <text x="82" y="1063" class="mono tiny">stdout 3445 bytes · sha256 d5c2121a22967b0a… · stderr empty</text>
  <text x="66" y="1130" class="sans small">Exit 1 is a valid complete fail/indeterminate report; exit 2 is reserved for process-boundary errors.</text>
  <text x="38" y="1185" class="sans tiny">Source-generated index of actual runs; no hostname, absolute path, timestamp, secret, or personal data.</text>
</svg>
