<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">LossTopology Lab real subprocess capture</title>
  <desc id="description">A deterministic rendering of actual standard-library CLI subprocess output for the healthy and empty-assistant fixtures.</desc>
  <rect width="1600" height="900" fill="#08111f"/>
  <style>
    .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .title { fill: #f8fafc; font-size: 34px; font-weight: 760; }
    .subtitle { fill: #cbd5e1; font-size: 17px; }
    .label { fill: #e2e8f0; font-size: 16px; font-weight: 680; }
    .small { fill: #cbd5e1; font-size: 13px; }
    .tiny { fill: #e2e8f0; font-size: 11px; }
    .scope { fill: #dbeafe; font-size: 13px; font-weight: 650; letter-spacing: .35px; }
  </style>
  <rect x="54" y="42" width="1492" height="810" rx="18" fill="#050a13" stroke="#334155" stroke-width="2"/>
  <circle cx="88" cy="76" r="8" fill="#ef4444"/>
  <circle cx="116" cy="76" r="8" fill="#f59e0b"/>
  <circle cx="144" cy="76" r="8" fill="#22c55e"/>
  <text x="800" y="82" class="mono small" text-anchor="middle">captured subprocess session</text>
  <line x1="54" y1="102" x2="1546" y2="102" stroke="#334155"/>
  <text x="82" y="136" class="mono" fill="#f8fafc" font-size="15" font-weight="760">LOSS TOPOLOGY LAB / REAL SUBPROCESS CAPTURE</text>
  <text x="82" y="166" class="mono" fill="#d1fae5" font-size="15" font-weight="400">evidence sandbox: committed synthetic fixtures copied byte-for-byte; repository loss_topology package</text>
  <text x="82" y="196" class="mono" fill="#d1fae5" font-size="15" font-weight="400">scope: no tokenizer, causal shift, loss, model, trainer, dataset, network, or GPU</text>
  <text x="82" y="226" class="mono" fill="#d1fae5" font-size="15" font-weight="400"></text>
  <text x="82" y="256" class="mono" fill="#93c5fd" font-size="15" font-weight="650">$ python3 -m loss_topology.cli --input input/healthy.v1.json --output output/healthy.audit.json</text>
  <text x="82" y="286" class="mono" fill="#d1fae5" font-size="15" font-weight="400">{&quot;output_sha256&quot;:&quot;8e562de5355e1ec7bf516119f2174613ac48b9db5da45bcf8f5492b821c29fab&quot;,&quot;status&quot;:&quot;pass&quot;}</text>
  <text x="82" y="316" class="mono" fill="#fcd34d" font-size="15" font-weight="400">[recorder] exit=0 stderr=empty</text>
  <text x="82" y="346" class="mono" fill="#d1fae5" font-size="15" font-weight="400"></text>
  <text x="82" y="376" class="mono" fill="#93c5fd" font-size="15" font-weight="650">$ python3 -m loss_topology.cli --input input/empty-assistant.v1.json --output output/empty-assistant.audit.json</text>
  <text x="82" y="406" class="mono" fill="#d1fae5" font-size="15" font-weight="400">{&quot;output_sha256&quot;:&quot;7c04b2309a661b1b0e748cb2ce5948817c65630b27e4ba3131670bd21d1c54d2&quot;,&quot;status&quot;:&quot;fail&quot;}</text>
  <text x="82" y="436" class="mono" fill="#fcd34d" font-size="15" font-weight="400">[recorder] exit=1 stderr=empty</text>
  <text x="82" y="466" class="mono" fill="#d1fae5" font-size="15" font-weight="400"></text>
  <text x="82" y="496" class="mono" fill="#cbd5e1" font-size="15" font-weight="400">note: exit 1 is the expected diagnostic status for the valid empty-assistant fixture; it is not a CLI error</text>
  <text x="82" y="526" class="mono" fill="#cbd5e1" font-size="15" font-weight="400">fault-injection evidence is executed separately in memory through audit_label_topology; it is not CLI output</text>
  <rect x="82" y="742" width="692" height="82" rx="12" fill="#0d2d22" stroke="#22c55e"/>
  <text x="104" y="773" class="sans label">healthy · exit 0 · pass</text>
  <text x="104" y="801" class="mono tiny">audit sha256 8e562de5355e1ec7bf516119f2174613ac48b9db5da45bcf8f5492b821c29fab</text>
  <rect x="798" y="742" width="720" height="82" rx="12" fill="#332810" stroke="#f59e0b"/>
  <text x="820" y="773" class="sans label">empty assistant · exit 1 · diagnostic fail</text>
  <text x="820" y="801" class="mono tiny">audit sha256 7c04b2309a661b1b0e748cb2ce5948817c65630b27e4ba3131670bd21d1c54d2</text>
  <text x="54" y="882" class="sans tiny">Exact raw transcript and execution metadata are bound in loss-topology-evidence.v1.json.</text>
</svg>
