name: Verify

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"

jobs:
  stdlib:
    name: Standard-library gate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Confirm the optional runtime is absent
        run: |
          python - <<'PY'
          import importlib.util

          if importlib.util.find_spec("tokenizers") is not None:
              raise SystemExit("tokenizers must be absent from the stdlib gate")
          PY

      - name: Verify the inherited snapshot provenance
        run: python -B tools/verify_legacy_snapshot.py

      - name: Run the base-install test suite
        run: python -B -m unittest discover -s tests -v

      - name: Reproduce the LossTopology evidence
        run: python -B tools/render_loss_topology_evidence.py --check

      - name: Confirm verification left the checkout clean
        run: test -z "$(git status --short)"